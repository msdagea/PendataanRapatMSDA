<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pendataan Kehadiran</title><link rel="stylesheet" href="style.css"></head><body>
<main><h1 id="ttl">PENDATAAN</h1><div id="err"></div>
<div class="card" id="info"></div><div class="stats" id="stats"></div>
<div id="closed" class="card hide"><h2>Pendataan belum dibuka</h2><p>Tunggu pengumuman dari BPH.</p></div>
<div id="quorum" class="card big hide"></div>
<div id="form" class="card hide"><h2>Isi Kehadiran</h2>
<input id="who" list="dl" placeholder="Ketik nama / NIM kamu"><datalist id="dl"></datalist>
<div class="btns" id="opts"><button class="b" data-s="ONTIME">HADIR</button><button class="b" data-s="TELAT">TELAT</button><button class="b" data-s="TIDAK HADIR">TIDAK HADIR</button></div>
<textarea id="why" class="hide" rows="3" placeholder="Alasan (wajib diisi)"></textarea>
<button class="go" id="send">KIRIM</button><div id="res"></div></div></main>
<script src="common.js"></script><script>
frame(); let pick = "";
async function load() {
  const s = await api({ action: "state" });
  if (!s.ok) return say($("#err"), s.error, 1);
  $("#err").innerHTML = ""; S = s;
  if (!s.configured) return say($("#err"), "Spreadsheet belum diatur admin", 1);
  renderInfo(s); renderStats(s);
  const m = s.mode;
  $("#ttl").textContent = s.quorum ? "KEHADIRAN" : "PENDATAAN";
  $("#closed").classList.toggle("hide", m !== "tutup");
  $("#form").classList.toggle("hide", m !== "pendataan");
  $("#quorum").classList.toggle("hide", !s.quorum);
  if (s.quorum) $("#quorum").innerHTML = `<h2>${m === "ring1" ? "KUORUM RING 1" : "KUORUM"}</h2><div class="t">${esc(s.quorum.text)}</div><p>Jumlah yang datang</p><div class="n">${esc(s.quorum.count)}</div>`;
  if (!$("#dl").children.length) $("#dl").innerHTML = s.members.map(x => `<option value="${esc(x.nim)} — ${esc(x.nama)}">`).join("");
}
$("#opts").onclick = e => {
  const b = e.target.closest("button"); if (!b) return;
  pick = b.dataset.s;
  document.querySelectorAll("#opts .b").forEach(x => x.classList.toggle("on", x === b));
  $("#why").classList.toggle("hide", pick === "ONTIME");
};
$("#send").onclick = async () => {
  const nim = $("#who").value.split(" — ")[0].trim(), why = $("#why").value.trim(), res = $("#res");
  if (!S.members.find(x => x.nim === nim)) return say(res, "Pilih namamu dari daftar", 1);
  if (!pick) return say(res, "Pilih status kehadiran", 1);
  if (pick !== "ONTIME" && !why) return say(res, "Alasan wajib diisi untuk telat / tidak hadir", 1);
  $("#send").disabled = true;
  const r = await api({ action: "submit", nim, status: pick, reason: why });
  $("#send").disabled = false;
  say(res, r.ok ? "Kehadiranmu tersimpan. Terima kasih!" : r.error, !r.ok);
  if (r.ok) { $("#why").value = ""; load(); }
};
load(); setInterval(load, 15000);
</script></body></html>
